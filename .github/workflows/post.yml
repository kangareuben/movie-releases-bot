name: "Post to Bluesky"

# Triggered daily at 13:13 UTC by an external scheduler (cron-job.org) calling
# the workflow_dispatch API. GitHub's own `schedule:` trigger was unreliable
# for this repo, silently skipping runs. It can also be run manually from the
# Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Send post
        run: npm start
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
